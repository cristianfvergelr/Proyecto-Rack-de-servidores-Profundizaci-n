<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo ambiental</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0f1518;color:#e8eeec}
  header{padding:22px 26px;border-bottom:1px solid #22302e}
  h1{margin:0;font-size:1.25rem}
  main{padding:22px 26px;max-width:1100px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .kpi{background:#16201f;border:1px solid #24312f;border-radius:6px;padding:14px 16px}
  .kpi span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8ba39e}
  .kpi b{display:block;font-size:1.9rem;font-weight:600;margin-top:4px}
  .barra{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
  button{background:#16201f;color:#cfdedb;border:1px solid #2c3a37;
         border-radius:5px;padding:7px 13px;cursor:pointer;font:inherit;font-size:.86rem}
  button[aria-pressed="true"]{border-color:#3fcfbe;color:#3fcfbe}
  .panel{background:#16201f;border:1px solid #24312f;border-radius:6px;padding:16px;margin-top:6px}
  #estado{color:#8ba39e;font-size:.84rem;margin-top:12px}
</style>
</head>
<body>
<header><h1>Monitoreo de temperatura y humedad</h1></header>
<main>
  <div class="kpis">
    <div class="kpi"><span>Temperatura actual</span><b id="tAhora">--</b></div>
    <div class="kpi"><span>Humedad actual</span><b id="hAhora">--</b></div>
    <div class="kpi"><span>Máx / mín temp</span><b id="tRango">--</b></div>
    <div class="kpi"><span>Muestras</span><b id="nDatos">--</b></div>
  </div>

  <div class="barra">
    <button data-h="6"   aria-pressed="false">6 horas</button>
    <button data-h="24"  aria-pressed="true">24 horas</button>
    <button data-h="168" aria-pressed="false">7 días</button>
    <button id="csv">Descargar CSV</button>
  </div>

  <div class="panel"><canvas id="grafica" height="120"></canvas></div>
  <p id="estado">Cargando…</p>
</main>

<script>
const SUPABASE_URL = "https://zsfaxjetkuxlhtdcaayt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZmF4amV0a3V4bGh0ZGNhYXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTY2MjMsImV4cCI6MjEwNTkzMjYyM30.zEtRfQ4HvbIoaj3pROkjWDjaC-TYR0EnulG8oehWS04";

let horas = 24, filas = [], chart;

async function traer(){
  const desde = new Date(Date.now() - horas*3600e3).toISOString();
  const url = SUPABASE_URL + "/rest/v1/lecturas"
            + "?select=temperatura,humedad,creado_en"
            + "&creado_en=gte." + desde
            + "&order=creado_en.asc&limit=10000";
  const r = await fetch(url, { headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
  }});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function pintar(){
  const etiquetas = filas.map(f => new Date(f.creado_en).toLocaleString("es-CO",
                      {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}));
  const temp = filas.map(f => +f.temperatura);
  const hum  = filas.map(f => +f.humedad);

  const ult = filas[filas.length-1];
  document.getElementById("tAhora").textContent = ult ? (+ult.temperatura).toFixed(1)+" °C" : "--";
  document.getElementById("hAhora").textContent = ult ? (+ult.humedad).toFixed(1)+" %"   : "--";
  document.getElementById("tRango").textContent = temp.length
      ? Math.max(...temp).toFixed(1)+" / "+Math.min(...temp).toFixed(1)+" °C" : "--";
  document.getElementById("nDatos").textContent = filas.length;

  const datos = {
    labels: etiquetas,
    datasets: [
      { label:"Temperatura (°C)", data:temp, yAxisID:"y",
        borderColor:"#efa45c", backgroundColor:"rgba(239,164,92,.12)",
        fill:true, tension:.3, pointRadius:0, borderWidth:2 },
      { label:"Humedad (%HR)",  data:hum,  yAxisID:"y2",
        borderColor:"#3fcfbe", backgroundColor:"rgba(63,207,190,.12)",
        fill:true, tension:.3, pointRadius:0, borderWidth:2 }
    ]
  };
  const opciones = {
    responsive:true, interaction:{mode:"index",intersect:false},
    plugins:{ legend:{labels:{color:"#cfdedb"}} },
    scales:{
      x:{ ticks:{color:"#8ba39e",maxTicksLimit:8}, grid:{color:"#22302e"} },
      y:{ position:"left",  title:{display:true,text:"°C",color:"#efa45c"},
          ticks:{color:"#8ba39e"}, grid:{color:"#22302e"} },
      y2:{position:"right", title:{display:true,text:"%HR",color:"#3fcfbe"},
          ticks:{color:"#8ba39e"}, grid:{drawOnChartArea:false} }
    }
  };
  if(chart){ chart.data = datos; chart.update(); }
  else { chart = new Chart(document.getElementById("grafica"), {type:"line", data:datos, options:opciones}); }
}

async function refrescar(){
  const estado = document.getElementById("estado");
  try{
    filas = await traer();
    pintar();
    estado.textContent = "Actualizado " + new Date().toLocaleTimeString("es-CO")
                       + " · " + filas.length + " registros";
  }catch(e){
    estado.textContent = "Error al consultar la base: " + e.message;
  }
}

document.querySelectorAll("button[data-h]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("button[data-h]").forEach(x => x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    horas = +b.dataset.h;
    refrescar();
  };
});

document.getElementById("csv").onclick = () => {
  const texto = "fecha,temperatura,humedad\n" +
    filas.map(f => [f.creado_en, f.temperatura, f.humedad].join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], {type:"text/csv"}));
  a.download = "lecturas.csv";
  a.click();
};

refrescar();
setInterval(refrescar, 60000);
</script>
</body>
</html>
